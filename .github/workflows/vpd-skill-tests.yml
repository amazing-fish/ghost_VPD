name: VPD Skill tests (manual cloud fallback)

# Daily development uses scripts/run_local_ci.py. No push/PR/schedule trigger.
on:
  workflow_dispatch:
    inputs:
      allow_cloud_minutes:
        description: 'Run paid/quota-consuming hosted Linux and Windows jobs'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  pytest:
    if: ${{ inputs.allow_cloud_minutes }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vpd_skill
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vpd_skill/requirements.txt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements.txt
      - name: Test on Linux
        if: runner.os == 'Linux'
        # Successful tmp_path copies are disposable; retain assertion-failure fixtures.
        run: python -m pytest -q -o tmp_path_retention_policy=failed
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m pytest -q -o tmp_path_retention_policy=failed
