name: VPD Skill tests

on:
  pull_request:
    paths:
      - 'vpd_skill/**'
      - '.github/workflows/vpd-skill-tests.yml'
  push:
    branches: [main]
    paths:
      - 'vpd_skill/**'
      - '.github/workflows/vpd-skill-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vpd_skill
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vpd_skill/requirements.txt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements.txt
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: python -m pytest -q
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m pytest -q
